<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>☕ Chill & Brew</h1>
        <p>Fresh & Delicious Cold Coffee</p>
    </header>

    <main>
        <h2>Our Menu</h2>

        <div id="coffee-list" class="coffee-container"></div>

        <section class="cart">
            <h2>🛒 Your Order</h2>

            <div id="cart-items"></div>

            <h3>Total: ₹<span id="total">0</span></h3>

            <button id="order-btn">Place Order</button>
        </section>
    </main>

    <footer>
        <p>© 2026 Chill & Brew Coffee Shop</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
